plugins {
    id 'com.android.application'
}

android {
    namespace 'com.forklift.controller'
    compileSdk 34

    defaultConfig {
        applicationId "com.forklift.controller"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // The app itself uses only framework classes (no AndroidX), so there are no runtime dependencies.
    testImplementation 'junit:junit:4.13.2'
}
